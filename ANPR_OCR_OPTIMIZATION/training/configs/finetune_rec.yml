# ============================================================
# PaddleOCR Fine-Tuning Configuration (Transfer Learning)
# ANPR OCR Optimization Platform (Priyanka)
# Architecture: SVTR_LCNet (PP-OCRv4 Alphanumeric Recognition)
# ============================================================

Global:
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./models/fine_tuned/v1/
  save_epoch_step: 10
  eval_batch_step: [0, 500]
  cal_metric_during_train: True
  
  # TRANSFER LEARNING: Pretrained PaddleOCR recognition weights
  # We do NOT train from scratch. Pretrained weights provide general text features.
  pretrained_model: ./models/baseline/en_PP-OCRv4_rec/best_accuracy
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  
  # Character dictionary generated from verified labels (A-Z, 0-9)
  character_dict_path: ./data/train/character_dict.txt
  max_text_length: 12
  infer_mode: false
  use_space_char: false
  distributed: false

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Piecewise
    decay_epochs: [70, 90]
    # TRANSFER LEARNING: Reduced learning rate (1e-4 -> 1e-5 -> 1e-6) for fine-tuning
    values: [0.0001, 0.00001, 0.000001]
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [1, 2]
    last_pool_type: avg
    last_pool_kernel_size: [2, 2]
  Neck:
    name: SequenceEncoder
    encoder_type: svtr
    dims: 64
    depth: 2
    hidden_dims: 120
    use_guide: True
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: True

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/train/
    label_file_list:
      - ./data/train/train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: False
      - RecAug:
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: [image, label, length]
  loader:
    shuffle: True
    batch_size_per_card: 128
    drop_last: True
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/validation/
    label_file_list:
      - ./data/validation/val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: False
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: [image, label, length]
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 128
    num_workers: 8
